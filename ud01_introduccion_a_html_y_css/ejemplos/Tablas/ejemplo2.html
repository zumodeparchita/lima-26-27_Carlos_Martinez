<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJEMPLO DE COMBINACIONES DE TABLAS</title>
</head>
<body>
    <table border="1">
        <thhead></thhead>
        <tbody>
            <tr><!--Fila 1-->
                <td>Fila 1, Columna 1</td>
                <td colspan="2" rowspan="2">Fila 1, Columna 2</td>
                <td>Fila 1, Columna 3</td>
            </tr>
            <tr><!--Fila 2-->
                <td>Fila 2, Columna 1</td>
                <td>Fila 2, Columna 2</td>
            </tr>
            <tr><!--Fila 3-->
                <td colspan="2">Fila 3, Columna 1</td>
                <td rowspan="2">Fila 3, Columna 2</td>
                <td>Fila 3, Columna 3</td>
            </tr>
            <tr><!--Fila 4-->
                <td colspan="2">Fila 4, Columna 1</td>
                <td>Fila 4, Columna 2</td>
            </tr>
            <tr><!--Fila 5-->
                <td colspan="2">Fila 5, Columna 1</td>
                <td colspan="2">Fila 5, Columna 2</td>
            </tr>
            <tr>
                <!--Fila 6-->
                <td> Fila 6, Columna 1</td>
                <td> Fila 6, Columna 2</td>
                <td colspan="2"> Fila 6, Columna 3</td>
            </tr>
        </tbody>
        <tfoot></tfoot>

    </table>

</body>
</html>
