<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de tabla básica</title>
</head>
<body>
    
    <table border="1">
        <caption> Este es el título de la tabla</caption>
        <thead>
            <!--Filas que formen parte del encabezado de la tabla-->
            <tr>
                <!-- tr es Table Row-->
                 <th scope="col">Encabezado de la columna 1</th>
                 <th scope="col">Encabezado de la columna 2</th>
                 <th scope="col">Encabezado de la columna 3</th>
            </tr>
        </thead>
        <tbody>
            <!-- Filas que formen parte del cuerpo de la tabla-->
             <tr>
                <th scope="row"> Esto encabeza una fila y es correcto</th>
                <td>Esto es un dato</td>
                <td>Esto es otro dato</td>
             </tr>
             <tr>
                <th scope="row">Encabezado de la fila 2</th>
                <td>Primer dato de la fila 2</td>
                <td>Segundo dato de la fila 2</td>
             </tr>
        </tbody>
        <tfoot>
            <!--filas que formen parte del pie de la tabla-->
            <tr>
                <th scope="row">Encabezado</th>
                <td>Dato 1</td>
                <td>Dato 2</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
