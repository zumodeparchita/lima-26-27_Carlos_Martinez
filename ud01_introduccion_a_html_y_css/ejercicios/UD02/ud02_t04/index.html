<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UD02_T04 Estilizado de formulario</title>
    <meta name="author" content="Carlos Martinez">
    <meta name="description" content="UD02_T04 Estilizado de Formularios || Lima">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="contenedor_formulario">
        <h2>Validación de formularios</h2>
        <form action="#" method="post" id="formulario">
            <label for="name"></label>
            <input type="text" id="name" name="nombre" required placeholder="Nombre">
            <label for="email"></label>
            <input type="email" id="email" name="correoe" required placeholder="Email">
            <label for="nickname"></label>
            <input type="text" name="apodo" id="nickname" placeholder="Apodo">
            <label for="music"></label>
            <input type="text" name="musica" id="music" placeholder="Grupo de música favorito">
        </form>
    </div>
</body>

</html>
