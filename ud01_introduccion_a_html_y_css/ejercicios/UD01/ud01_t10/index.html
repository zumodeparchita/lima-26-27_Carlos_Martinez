<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario en HTML 5</title>
    <meta name="author" content="Carlos Martinez">
    <meta name="description" content="Tarea UD01_T10 Formulario de registro">  
</head>
<body>
    <form action="#" method="get">
        <label>Nombre: 
            <input type="text" name="nombre" required autofocus>
        </label>
        <br>
        <label>Correo electrónico: 
            <input type="email" name="correo" required>
        </label>
        <br>
        <label>URL: 
            <input type="url" name="url" placeholder="Introduce aquí el URL de tu web personal">
        </label>
        <br>
        <label>Fecha: 
            <input type="date" name="fecha">
        </label>
        <br>
        <label>Hora: 
            <input type="time" name="hora">
        </label>
        <br>
        <label>Edad: 
            <input type="number" name="edad" min="18" max="65">
        </label>
        <br>
        <label>Teléfono: 
            <input type="tel" name="telefono">
        </label>
        <br>
        <label>Color favorito: 
            <input type="color" name="color">
        </label>
        <br>
        <input type="submit" name="Enviar">
    </form>
</body>
</html>
