<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formulario de registro</title>
    <meta name="author" content="Carlos Martinez">
</head>
<body>
    <form action="" method="get">
        <label>Nombre:
            <input type="text" name="nombre" maxlength="50">
        </label>
        <br>
        <label>Apellidos:
            <input type="text" name="apellidos" maxlength="50">
        </label>
        <br>
        Sexo:
        <label><input type="radio" name="sexo" value="hombre"> Hombre</label>
        <label><input type="radio" name="sexo" value="mujer"> Mujer</label>
        <br>
        <label>Correo electrónico:
            <input type="email" name="correo">
        </label>
        <br>
        <label>
            <input type="checkbox" name="novedades" checked>
            Deseo recibir información sobre novedades y ofertas
        </label>
        <br>
        <label>
            <input type="checkbox" name="condiciones">
            Declaro aceptar las condiciones generales del programa y la normativa sobre protección de datos
        </label>
        <br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
