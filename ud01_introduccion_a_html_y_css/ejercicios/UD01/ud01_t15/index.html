<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilizado de tabla con selectores posicionales</title>
    <meta name="author" content="Carlos Martinez">
    <meta name="description" content="UD01_T15 Estilizado de tabla con selectores posicionales">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <table>
        <tr>
            <td rowspan="3">1.1</td>
            <td rowspan="2">2.1</td>
            <td colspan="2">3.1</td>
            <td rowspan="3">4.1</td>
            <td colspan="2">5.1</td>
        </tr>
        <tr>
            <td>1.2</td>
            <td>2.2</td>
            <td>3.2</td>
            <td>4.2</td>
        </tr>
        <tr>
            <td colspan="2">1.3</td>
            <td>2.3</td>
            <td>3.3</td>
            <td rowspan="3">4.3</td>
        </tr>
        <tr>
            <td>1.4</td>
            <td colspan="2">2.4</td>
            <td colspan="3">3.4</td>
        </tr>
        <tr>
            <td>1.5</td>
            <td colspan="2">2.5</td>
            <td rowspan="2">3.5</td>
            <td colspan="2">4.5</td>
        </tr>
        <tr>
            <td>1.6</td>
            <td colspan="2">2.6</td>
            <td colspan="3">3.6</td>
        </tr>
        <tr>
            <td rowspan="4">1.7</td>
            <td rowspan="2" colspan="2">2.7</td>
            <td>3.7</td>
            <td colspan="3">4.7</td>
        </tr>
        <tr>
            <td rowspan="3">1.8</td>
            <td rowspan="3" colspan="3">2.8</td>
        </tr>
        <tr>
            <td>1.9</td>
            <td>2.9</td>
        </tr>
        <tr>
            <td>1.10</td>
            <td>2.10</td>
        </tr>
        <tr>
            <td>1.11</td>
            <td colspan="4">2.11</td>
            <td>3.11</td>
            <td rowspan="2">4.11</td>
        </tr>
        <tr>
            <td colspan="3">1.12</td>
            <td>2.12</td>
            <td rowspan="2">3.12</td>
            <td rowspan="2">4.12</td>
        </tr>
        <tr>
            <td rowspan="5" colspan="3">1.13</td>
            <td>2.13</td>
            <td>3.13</td>
        </tr>
        <tr>
            <td>1.14</td>
            <td>2.14</td>
            <td>3.14</td>
            <td>4.14</td>
        </tr>
        <tr>
            <td>1.15</td>
            <td>2.15</td>
            <td rowspan="2" colspan="2">3.15</td>
        </tr>
        <tr>
            <td rowspan="3">1.16</td>
            <td rowspan="3">2.16</td>
        </tr>
        <tr>
            <td colspan="2">1.17</td>
        </tr>
        <tr>
            <td>1.18</td>
            <td colspan="2">2.18</td>
            <td colspan="2">3.18</td>
        </tr>
        <tr>
            <td>1.19</td>
            <td colspan="6">2.19</td>
        </tr>
    </table>
</body>
</html>
